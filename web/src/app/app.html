<main>
  <header>
    <h1>AI Tech Lead</h1>
    <small>{{ messageCount() }} mensajes</small>
  </header>

  <app-message-list
    [messages]="messages()"
    [isThinking]="isThinking()"
    (editRequested)="editMessage($event)"
  />
  @if (errorMessage()) {
    <p>{{errorMessage()}}</p>
  }
  <app-chat-input [disabled]="isThinking()" (send)="send($event)" [(draft)]="draft" />
</main>
