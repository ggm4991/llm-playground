<p [class.user]="isUser()">
  <strong>{{ message().role }}:</strong>
  {{ preview() }}

  <button (click)="onCopyClick()">Copiar</button>

  @if (isMaxLength()) {
    <button (click)="toggleExpanded()">
      {{ isExpanded() ? 'Ver menos' : 'Ver más' }}
    </button>
  }

  @if (isUser()) {
    <button (click)="onEditClick()">
      Editar
    </button>
  }

</p>
